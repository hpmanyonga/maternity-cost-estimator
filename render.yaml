services:
  - type: web
    name: maternity-cost-estimator
    runtime: docker
    plan: free
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: NETWORK_ONE_AUDIT_SALT
        sync: false
      - key: GOOGLE_SHEETS_CREDENTIALS
        sync: false
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: PORT
        value: "8501"
